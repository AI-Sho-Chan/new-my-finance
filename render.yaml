services:
  - type: web
    name: myfinance-backend
    env: python
    plan: free
    region: oregon
    branch: restore/prod-stable
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
  - type: web
    name: myfinance-frontend
    env: node
    plan: free
    region: oregon
    branch: restore/prod-stable
    autoDeploy: true
    buildCommand: |
      cd web
      npm ci
      npm run build
    startCommand: |
      cd web
      node server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '18'
      - key: VITE_BACKEND_URL
        value: https://REPLACE_WITH_BACKEND_URL
