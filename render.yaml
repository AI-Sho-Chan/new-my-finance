services:
  - type: web
    name: myfinance-backend
    env: python
    plan: free
    region: oregon
    branch: restore/prod-stable
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend
      uvicorn main:app --host 0.0.0.0 --port 
  - type: static_site
    name: myfinance-frontend
    plan: free
    region: oregon
    branch: restore/prod-stable
    autoDeploy: true
    buildCommand: |
      cd web
      npm ci --include=dev
      npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://REPLACE_WITH_BACKEND_URL

